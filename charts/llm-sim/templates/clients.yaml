{{- if .Values.clients.enabled }}
# Четыре клиентских Pod с разными IP; генератор запускается в них через kubectl exec.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loadclient
spec:
  serviceName: loadclient
  replicas: {{ .Values.clients.replicas }}
  podManagementPolicy: Parallel
  selector: {matchLabels: {app.kubernetes.io/name: loadclient}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loadclient}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: client
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["sleep", "infinity"]
          resources: {{- toYaml .Values.clients.resources | nindent 12 }}
{{- end }}
